plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.5.1'
    // Declares JavaFX as a real Maven dependency (instead of relying on the
    // JDK's bundled copy) so shadowJar can pack the JavaFX jars into ben.jar.
    // That lets the release JAR run on any JDK, not just an FX-flavoured one.
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

javafx {
    version = '25.0.1'
    // "controls" pulls in javafx.base and javafx.graphics transitively; the
    // GUI (see Launcher/Main) does not use FXML, so that module is omitted.
    modules = ['javafx.controls']
}

dependencies {
    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    // Level-10: the GUI is the app's front door now. Ben.main still runs
    // the old console version for anyone who wants it.
    mainClass = 'ben.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'ben.jar'
}

run {
    standardInput = System.in
    // A-Assertions: JavaExec tasks disable assertions by default, unlike the
    // "test" task (which Gradle already runs with them on). Turn them on
    // here too so "gradle run" actually exercises the asserts below.
    enableAssertions = true
}
